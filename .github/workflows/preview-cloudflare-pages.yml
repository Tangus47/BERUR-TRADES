name: Deploy isolated BERUR adaptive preview

on:
  push:
    branches:
      - feature/adaptive-market-selection
    paths:
      - "index.html"
      - "adaptive-market-selection.js"
      - "signal-intelligence.js"
      - "economic-news.js"
      - "deriv-trader.js"
      - "cloudflare-worker/**"
      - "tests/**"
      - ".github/workflows/preview-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Publish isolated Cloudflare Pages preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out adaptive branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run automated regression tests before publishing
        run: node --test tests/*.test.js

      - name: Verify Cloudflare preview credentials
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_PAGES_API_TOKEN" || (echo "Missing CLOUDFLARE_PAGES_API_TOKEN GitHub secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret" && exit 1)

      - name: Create separate preview project if needed
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="berur-trades-adaptive-preview"
          if npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main; then
            echo "Created isolated Pages project: $PROJECT"
          else
            npx --yes wrangler@4 pages project list | grep -F "$PROJECT" || {
              echo "Could not create or verify the isolated preview project. Check that the Cloudflare token has Cloudflare Pages: Edit permission."
              exit 1
            }
            echo "Using existing isolated Pages project: $PROJECT"
          fi

      - name: Deploy preview branch only
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . --project-name=berur-trades-adaptive-preview --branch=adaptive-preview

      - name: Verify isolated preview Worker health and CORS
        env:
          PREVIEW_WORKER: https://fix-demo-auto-execution-paused-berur-trades-backend.tangusvincent47.workers.dev
          PREVIEW_ORIGIN: https://adaptive-preview.berur-trades-adaptive-preview.pages.dev
        run: |
          curl --fail --silent --show-error "$PREVIEW_WORKER/health" | grep -F '"status":"ok'
          headers="$(mktemp)"
          status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --request OPTIONS "$PREVIEW_WORKER/oauth/redeem" --header "Origin: $PREVIEW_ORIGIN" --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: content-type')"
          if [ "$status" != "204" ] || ! grep -iF "Access-Control-Allow-Origin: $PREVIEW_ORIGIN" "$headers"; then
            echo "Preview Worker is not ready: expected a 204 CORS preflight response allowing $PREVIEW_ORIGIN."
            cat "$headers"
            exit 1
          fi
          echo "Isolated preview Worker health and CORS checks passed."

# Keep this workflow on the adaptive branch until its isolated preview is validated.
