name: Deploy isolated BERUR adaptive preview

on:
  push:
    branches:
      - feature/adaptive-market-selection
    paths:
      - "index.html"
      - "adaptive-market-selection.js"
      - "signal-intelligence.js"
      - "economic-news.js"
      - "deriv-trader.js"
      - ".github/workflows/preview-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Publish isolated Cloudflare Pages preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out adaptive branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN GitHub secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret" && exit 1)

      - name: Create separate preview project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="berur-trades-adaptive-preview"
          if npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main; then
            echo "Created isolated Pages project: $PROJECT"
          else
            npx --yes wrangler@4 pages project list | grep -F "$PROJECT" || {
              echo "Could not create or verify the isolated preview project. Check that the Cloudflare token has Cloudflare Pages: Edit permission."
              exit 1
            }
            echo "Using existing isolated Pages project: $PROJECT"
          fi

      - name: Deploy preview branch only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . --project-name=berur-trades-adaptive-preview --branch=adaptive-preview
