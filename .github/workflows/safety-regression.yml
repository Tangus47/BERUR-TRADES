name: BERUR TRADES Safety Regression Checks
on:
  push:
    branches: [main]
    paths:
      - 'deriv-trader.js'
      - 'binary-terminals.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/safety-regression.yml'
  pull_request:
    branches: [main, feat/independent-over-market-rankings, feat/modular-binary-terminals-rise-fall]
    paths:
      - 'deriv-trader.js'
      - 'binary-terminals.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/safety-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check deriv-trader.js
          node --check binary-terminals.js
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          scripts.forEach((match, index) => fs.writeFileSync('/tmp/berur-inline-' + index + '.js', match[1]));
          if (!scripts.length) throw new Error('No inline application scripts were found.');
          console.log('Extracted ' + scripts.length + ' inline application scripts.');
          NODE
          for file in /tmp/berur-inline-*.js; do node --check "$file"; done
      - name: Run safety regression assertions
        run: node tests/safety-regression.cjs
