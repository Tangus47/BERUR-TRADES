name: Deploy BERUR TRADES Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy existing Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Cloudflare KV configuration
        env:
          BERUR_SESSIONS_KV_ID: ${{ secrets.BERUR_SESSIONS_KV_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$BERUR_SESSIONS_KV_ID" || (echo "Missing GitHub secret: BERUR_SESSIONS_KV_ID" && exit 1)
          node <<'NODE'
          const fs = require("node:fs");
          const path = "cloudflare-worker/wrangler.jsonc";
          const id = process.env.BERUR_SESSIONS_KV_ID;
          if (!/^[a-f0-9]{32}$/i.test(id)) {
            throw new Error("BERUR_SESSIONS_KV_ID must be the 32-character Cloudflare KV namespace ID.");
          }
          const config = fs.readFileSync(path, "utf8");
          const placeholder = "REPLACE_WITH_KV_NAMESPACE_ID";
          if (!config.includes(placeholder)) {
            throw new Error("Expected KV namespace placeholder was not found; review wrangler.jsonc before deploying.");
          }
          fs.writeFileSync(path, config.replace(placeholder, id));
          NODE

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
          workingDirectory: cloudflare-worker
          wranglerVersion: "4"
