name: Deploy BERUR TRADES Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy existing Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Cloudflare KV configuration
        env:
          BERUR_SESSIONS_KV_ID: ${{ secrets.BERUR_SESSIONS_KV_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$BERUR_SESSIONS_KV_ID" || (echo "Missing GitHub secret: BERUR_SESSIONS_KV_ID" && exit 1)
          node <<'NODE'
          const fs = require("node:fs");
          const path = "cloudflare-worker/wrangler.jsonc";
          const id = process.env.BERUR_SESSIONS_KV_ID;
          if (!/^[a-f0-9]{32}$/i.test(id)) {
            throw new Error("BERUR_SESSIONS_KV_ID must be the 32-character Cloudflare KV namespace ID.");
          }
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          const namespace = config.kv_namespaces?.find(item => item.binding === "BERUR_SESSIONS");
          if (!namespace) {
            throw new Error("The BERUR_SESSIONS KV binding is missing from wrangler.jsonc.");
          }
          namespace.id = id;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
          workingDirectory: cloudflare-worker
          wranglerVersion: "4"

      - name: Verify deployed Worker health and OAuth entry
        run: |
          base="https://berur-trades-backend.tangusvincent47.workers.dev"
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$base/health")"
          printf 'Worker health response: %s\n' "$health"
          node -e 'const d=JSON.parse(process.argv[1]); if(d.status!=="ok" || d.service!=="BERUR TRADES OAuth backend") process.exit(1);' "$health"
          headers="$(curl --silent --show-error --max-time 20 --dump-header - --output /dev/null "$base/oauth/start")"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -Eiq '^HTTP/[^ ]+ 302'
          printf '%s\n' "$headers" | grep -Eiq '^location: https://auth\.deriv\.com/oauth2/auth'
