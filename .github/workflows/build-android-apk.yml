name: Build BERUR TRADES Android APK and Play Bundle
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'deriv-trader.js'
      - 'economic-news.js'
      - 'signal-intelligence.js'
      - 'privacy-policy.html'
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure optional Play upload signing
        env:
          BERUR_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BERUR_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BERUR_UPLOAD_KEYSTORE_BASE64" ]; then
            printf '%s' "$BERUR_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/berur-play-upload.jks"
            echo "BERUR_UPLOAD_KEYSTORE=$RUNNER_TEMP/berur-play-upload.jks" >> "$GITHUB_ENV"
            echo "Play upload signing key configured."
          else
            echo "No upload key configured; Play AAB will be an unsigned preparation artifact."
          fi
      - name: Build direct APK and Play Store App Bundle
        working-directory: android-app
        env:
          BERUR_UPLOAD_STORE_PASSWORD: ${{ secrets.BERUR_UPLOAD_STORE_PASSWORD }}
          BERUR_UPLOAD_KEY_ALIAS: ${{ secrets.BERUR_UPLOAD_KEY_ALIAS }}
          BERUR_UPLOAD_KEY_PASSWORD: ${{ secrets.BERUR_UPLOAD_KEY_PASSWORD }}
        run: gradle assembleDirectDebug bundlePlayRelease
      - name: Validate direct APK package and signature
        run: |
          set -euo pipefail
          APK="$(find android-app/app/build/outputs/apk/direct/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/berur-apk-badging.txt"
          grep -q "package: name='com.berurtrades.app'" "$RUNNER_TEMP/berur-apk-badging.txt"
          grep -q "sdkVersion:'23'" "$RUNNER_TEMP/berur-apk-badging.txt"
          echo "Validated APK size: $(stat -c%s "$APK") bytes"
      - name: Upload direct APK
        uses: actions/upload-artifact@v4
        with:
          name: BERUR-TRADES-Direct-APK
          path: android-app/app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find android-app/app/build/outputs/apk/direct/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          gh release create direct-latest --title "BERUR TRADES Direct APK" --notes "Validated direct Android APK. Existing installations can update only when signed with the same certificate." || true
          gh release upload direct-latest "$APK#BERUR-TRADES-Direct.apk" --clobber
      - name: Upload Play Store AAB preparation
        uses: actions/upload-artifact@v4
        with:
          name: BERUR-TRADES-Play-Store-AAB
          path: android-app/app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 30
