plugins { id 'com.android.application' }
android {
 namespace 'com.berurtrades.app'
 compileSdk 36
 buildFeatures { buildConfig true }
 defaultConfig { applicationId 'com.berurtrades.app'; minSdk 23; targetSdk 36; versionCode 4; versionName '1.3' }
 if (System.getenv('BERUR_UPLOAD_KEYSTORE')) {
  signingConfigs {
   playRelease {
    storeFile file(System.getenv('BERUR_UPLOAD_KEYSTORE'))
    storePassword System.getenv('BERUR_UPLOAD_STORE_PASSWORD')
    keyAlias System.getenv('BERUR_UPLOAD_KEY_ALIAS')
    keyPassword System.getenv('BERUR_UPLOAD_KEY_PASSWORD')
   }
  }
  buildTypes { release { signingConfig signingConfigs.playRelease } }
 }
 flavorDimensions += 'distribution'
 productFlavors {
  play { dimension 'distribution'; buildConfigField 'String', 'DISTRIBUTION', '"play"' }
  direct { dimension 'distribution'; buildConfigField 'String', 'DISTRIBUTION', '"direct"' }
 }
}
